<!DOCTYPE html><html lang="pt-BR" style=""><head>

<body class="bg-[#1C161C] flex justify-center items-center min-h-screen p-0 sm:p-4 text-[#2B232A] antialiased select-none">

<div class="w-6 h-6 rounded-full border border-white/20"></div>
</div>

<div>

</div>
</div>

</div>
</div>

</div>

<input class="w-full bg-transparent p-0 border-none font-bold text-xl text-[#2B2228] focus:ring-0 focus:outline-none" id="amount-input" placeholder="0,00" type="text" value="1.200,00">
</div>
</div>
<!-- Quick Value Adjustment Tags -->
<div class="flex items-center space-x-1.5 pt-1 overflow-x-auto no-scrollbar" data-purpose="quick-amount-chips">

</svg>
</div>

</div>
<button class="text-xs font-semibold text-[#8B8288] hover:text-brand-terracotta active:opacity-75 transition-colors" type="button">

<div class="space-y-1.5" data-purpose="payment-method-group">

<button class="w-full h-14 bg-brand-terracotta hover:bg-brand-terracotta-hover active:scale-[0.98] text-white font-bold rounded-2xl shadow-btn flex items-center justify-center space-x-2 transition-all duration-150" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
