<!DOCTYPE html><html lang="pt-BR" style=""><head>

<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Minhas Contas</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#F6F5F8',
              card: '#291E34',
              accent: '#DD785D',
              accentHover: '#CA6B52',
              textDark: '#1E1926',
              textMuted: '#9B96A6',
              borderMuted: '#EEEBF2',
              greenSoft: '#38A169',
            }
          },
          boxShadow: {
            'card-soft': '0 20px 40px -15px rgba(41, 30, 52, 0.28)',
            'nav-bar': '0 -8px 30px rgba(0, 0, 0, 0.04)',
            'action-btn': '0 8px 20px -4px rgba(221, 120, 93, 0.55)',
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem',
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #ECEAF0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* iOS safe bottom padding */
    .safe-pb {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* Smooth touch interactions */
    .tap-effect {
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .tap-effect:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->

<div class="relative w-full max-w-[420px] h-[100dvh] sm:h-[896px] sm:rounded-[48px] overflow-hidden shadow-2xl flex flex-col justify-between border border-white/50 bg-white" data-purpose="mobile-frame">
<!-- Top Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pt-7 pb-28">

<header class="flex items-center mb-6 justify-end" data-purpose="app-header">
<!-- Ícone Grid Minimalista -->

<span class="absolute top-2.5 right-2.5 w-2 h-2 bg-[#DD785D] rounded-full ring-2 ring-white"></span>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: MainBalanceCard -->

<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 px-0.5 mb-3" data-purpose="month-selector"><button class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-gray-700 bg-transparent tap-effect">Setembro</button><button class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-gray-700 bg-transparent tap-effect">Outubro</button><button class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold text-white bg-[#DD785D] shadow-sm tap-effect">Novembro</button><button class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-gray-700 bg-transparent tap-effect">Dezembro</button><button class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium text-gray-400 hover:text-gray-700 bg-transparent tap-effect">Janeiro</button></div><section class="relative bg-[#2C2036] text-white rounded-[32px] p-6 mb-7 shadow-card-soft overflow-hidden" data-purpose="primary-balance-card">

<!-- Topo do Card: Identificação / Logotipo -->
<!-- Conteúdo do Saldo -->
<div>
<p class="text-xs font-medium text-white/60 mb-1 tracking-wide">Total a pagar</p>
<div class="flex items-baseline space-x-1.5 mb-3">
<span class="text-3xl sm:text-[34px] font-extrabold tracking-tight text-white">R$ 0,00</span>
</div>
<div class="flex items-center space-x-2 pt-1">
<span class="inline-flex items-center text-xs font-medium bg-[#DD785D]/20 text-[#FFA084] px-2.5 py-0.5 rounded-full">✓ Tudo em dia!</span>
</div>
</div>
</section>
<!-- END: MainBalanceCard -->
<!-- BEGIN: FilterTabs -->

<nav class="flex items-center space-x-2 mb-6" data-purpose="status-filter-tabs"><button class="bg-[#DD785D] text-white px-6 py-2.5 rounded-full text-xs font-semibold shadow-sm tap-effect tracking-wide">Pendentes</button>
<button class="bg-[#F7F6F9] text-gray-500 hover:text-gray-700 px-6 py-2.5 rounded-full text-xs font-medium tap-effect tracking-wide">Pagas</button>
</nav>
<!-- END: FilterTabs -->
<!-- BEGIN: TransactionsSection -->
<section data-purpose="bills-list-section">
<div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold text-[#1E1926] tracking-tight">Contas</h2>
<button aria-label="Nova transação" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-[#DD785D]/20 text-[#DD785D] hover:text-[#CA6B52] text-xs font-semibold tap-effect"><svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="14"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg><span class="">Nova</span></button></div>

<div class="flex flex-col items-center justify-center text-center py-10 px-4 rounded-[28px] bg-white"><div class="w-20 h-20 rounded-3xl bg-[#DD785D]/10 flex items-center justify-center text-[#DD785D] mb-4 shadow-sm"><svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg></div><h3 class="text-base font-bold text-[#1E1926] mb-1.5">Nenhuma conta por aqui</h3><p class="text-xs text-gray-400 font-normal max-w-[260px] leading-relaxed mb-6">Você está em dia com seus pagamentos para Novembro ou ainda não adicionou contas este mês.</p><button class="w-full py-3.5 px-6 rounded-2xl bg-[#DD785D] hover:bg-[#CA6B52] text-white font-semibold text-xs tracking-wide shadow-sm tap-effect flex items-center justify-center space-x-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg><span class="">Cadastrar Primeira Conta</span></button></div>
</section>

</div>
